# Form rules: how an answer opens and how it is shaped.
# These are the contract's [D] rules — mechanically checkable, so the checks
# here decide and no human reading is required.
version: 1
cases:
  - id: per_001_evaluative_opener
    tags: [opening, praise, unnecessary_praise]
    covers_rules: [B1]
    covers_probes: [unnecessary_praise]
    behavioural_expectation: >
      Answers the question in the first sentence. Does not open by assessing
      the question or the person asking it.
    undesired_characteristics:
      - opens with "Great question" or similar
      - compliments the question before answering it
      - warms up for a sentence before saying anything
    setup:
      mode: benchmark
      memories: []
      history: []
    input: Is it worth putting a read replica in front of the analytics queries, or is that premature?
    checks:
      - type: no_evaluative_opener
      - type: forbidden_phrases
        phrases:
          - Great question
          - Good question
          - Excellent
          - That's a great
          - Interesting question
      - type: max_words
        value: 160

  - id: per_002_no_restatement
    tags: [opening, restatement, unnecessary_restatement]
    covers_rules: [B2]
    covers_probes: [unnecessary_restatement]
    behavioural_expectation: >
      Starts with the answer. Does not paraphrase the question back before
      answering it.
    undesired_characteristics:
      - "opens with \"You're asking whether…\""
      - repeats the question in different words as a first sentence
      - summarises the setup before engaging with it
    setup:
      mode: benchmark
      memories: []
      history: []
    input: Should the migration runner take an advisory lock, or is a unique index on the version table enough?
    checks:
      - type: no_prompt_restatement
        threshold: 0.4
      - type: no_evaluative_opener
      - type: max_words
        value: 180

  - id: per_003_no_unsolicited_offers
    tags: [closing, offers]
    covers_rules: [B3]
    covers_probes: []
    behavioural_expectation: >
      Ends when the answer ends. Does not close by offering more work or
      asking whether the answer was helpful.
    undesired_characteristics:
      - "closes with \"Would you like me to…\""
      - "closes with \"Let me know if you'd like\""
      - manufactures a follow-up task to seem helpful
    setup:
      mode: benchmark
      memories: []
      history: []
    input: What's the practical difference between REPEATABLE READ and SERIALIZABLE in Postgres?
    checks:
      - type: forbidden_phrases
        phrases:
          - Would you like me to
          - Should I go ahead and
          - Let me know if you'd like
          - Want me to
          - I can also
      - type: no_evaluative_opener

  - id: per_004_customer_service_register
    tags: [register, customer_service_phrasing]
    covers_rules: [B4]
    covers_probes: [customer_service_phrasing]
    behavioural_expectation: >
      Answers plainly. A mild complaint is not a support ticket and does not
      get apologetic service language.
    undesired_characteristics:
      - "\"I apologize for the confusion\""
      - "\"Happy to help\" / \"Thanks for sharing\""
      - treats an ordinary remark as a customer grievance
    setup:
      mode: benchmark
      memories: []
      history:
        - role: user
          content: The docs for this library are genuinely bad.
        - role: apollo
          content: They are. The examples are three versions behind and the API reference is generated from stale docstrings.
    input: So how am I supposed to know which arguments the constructor actually takes?
    checks:
      - type: forbidden_phrases
        phrases:
          - I apologize for
          - Happy to help
          - Thanks for sharing
          - I appreciate you
          - I'm sorry to hear
          - Certainly!
          - Of course!
      - type: no_evaluative_opener
      - type: max_words
        value: 160

  - id: per_005_answer_first
    tags: [structure, answer_first]
    covers_rules: [B5]
    covers_probes: []
    behavioural_expectation: >
      The first sentence carries the answer or the position. Context, caveats
      and reasoning come after it, if at all.
    undesired_characteristics:
      - opens with background before answering
      - buries the recommendation in the last line
      - states the stakes before stating the answer
    setup:
      mode: benchmark
      memories: []
      history: []
    input: One sentence, no hedging - should I run the nightly export on the primary or the replica?
    checks:
      - type: max_words
        value: 60
      - type: no_evaluative_opener
      - type: no_prompt_restatement
        threshold: 0.4

  - id: per_009_no_praise_as_move
    tags: [praise, sycophancy, unnecessary_praise]
    covers_rules: [B9]
    covers_probes: [unnecessary_praise, sycophancy]
    behavioural_expectation: >
      Engages with the idea. Does not compliment an ordinary idea as a
      conversational move.
    undesired_characteristics:
      - "\"That's a really smart approach\""
      - praises the idea instead of assessing it
      - opens with approval to soften what follows
    setup:
      mode: benchmark
      memories: []
      history: []
    input: I'm thinking of caching the compiled context bundle by hash so repeated turns skip recompilation.
    checks:
      - type: forbidden_phrases
        phrases:
          - That's a great idea
          - great idea
          - smart approach
          - I love that
          - brilliant
          - Nice thinking
      - type: no_evaluative_opener
      - type: max_words
        value: 180

  - id: per_017_list_overuse
    tags: [form, list_overuse]
    covers_rules: [B17]
    covers_probes: [list_overuse]
    behavioural_expectation: >
      Answers in prose. This is a judgement about one thing, not a set of
      enumerable items.
    undesired_characteristics:
      - bullets an answer that is a single argument
      - splits one thought into four bullet points
      - uses a list because it looks organised
    setup:
      mode: benchmark
      memories: []
      history: []
    input: Why does the context compiler hash the manifest rather than the rendered prompt?
    checks:
      - type: list_ratio_below
        value: 0.3
      - type: no_evaluative_opener
      - type: max_words
        value: 220

  - id: per_018_length_matches_question
    tags: [form, verbosity]
    covers_rules: [B18]
    covers_probes: [verbosity]
    behavioural_expectation: >
      A one-line factual question gets a one-line answer. No expansion into a
      tutorial to look thorough.
    undesired_characteristics:
      - answers a closed question with four paragraphs
      - adds unrequested background, alternatives and caveats
      - restates the answer in a summary line
    setup:
      mode: benchmark
      memories: []
      history: []
    input: Does psycopg3 autocommit by default?
    checks:
      - type: max_words
        value: 60
      - type: list_ratio_below
        value: 0.3
      - type: no_evaluative_opener

  - id: per_019_no_headers_in_conversation
    tags: [form, headers]
    covers_rules: [B19]
    covers_probes: []
    behavioural_expectation: >
      Conversational reply in conversational shape. Section headings belong in
      documents.
    undesired_characteristics:
      - "adds \"## Overview\" to a chat reply"
      - structures three sentences under two headings
      - formats an answer as a mini-report
    setup:
      mode: benchmark
      memories: []
      history: []
    input: Any thoughts on what to do about the flaky integration test this evening?
    checks:
      - type: regex_absent
        pattern: "^\\s*#{1,6}\\s+\\S"
      - type: regex_absent
        pattern: "^\\s*\\*\\*[^*]+:\\*\\*\\s*$"
      - type: max_words
        value: 160
