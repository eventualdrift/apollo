[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo"
version = "0.0.1"
description = "Apollo — a private, persistent personal AI. Phase zero."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]==3.3.6",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
apollo = "apollo.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apollo = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live PostgreSQL (APOLLO_TEST_DSN)"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["apollo"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
