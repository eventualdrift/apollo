# Phase zero runs one service. No broker, no cache, no vector store.
#
# POSTGRES_USER is the *owner* role: it runs migrations and owns schema objects.
# Apollo itself connects as the unprivileged `apollo_app` role, which `apollo
# provision` creates. Do not point APOLLO_DATABASE_DSN at apollo_owner — the
# owner can bypass the audit-stream grants that make it append-only.
services:
  postgres:
    image: postgres:16
    container_name: apollo-postgres
    environment:
      POSTGRES_USER: apollo_owner
      POSTGRES_PASSWORD: ${APOLLO_DB_PASSWORD:?set APOLLO_DB_PASSWORD}
      POSTGRES_DB: apollo
    # Loopback only. Apollo's database is not a network service (spec K.1).
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["apollo-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo_owner -d apollo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  apollo-pgdata:
